name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify schema contract files
        run: npm run check:schema-contract

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and contract tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: |
            .next
            !.next/cache/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  e2e:
    name: E2E shard ${{ matrix.shard }}/4
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atehna_e2e_run_${{ github.run_id }}_${{ github.run_attempt }}_shard_${{ matrix.shard }}
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atehna_e2e_run_${{ github.run_id }}_${{ github.run_attempt }}_shard_${{ matrix.shard }}"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: '1'
      E2E_MODE: '1'
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atehna_e2e_run_${{ github.run_id }}_${{ github.run_attempt }}_shard_${{ matrix.shard }}
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atehna_e2e_run_${{ github.run_id }}_${{ github.run_attempt }}_shard_${{ matrix.shard }}
      E2E_STORAGE_NAMESPACE: run-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
      ADMIN_USERNAME: e2e-admin
      ADMIN_PASSWORD: e2e-admin-password
      ADMIN_SESSION_SECRET: e2e-only-session-secret-with-at-least-32-characters
      ORDER_ACCESS_BOOTSTRAP_KEY: e2e-only-order-bootstrap-key-with-at-least-32-characters
      PLAYWRIGHT_SHARD: ${{ matrix.shard }}-of-4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download production build
        uses: actions/download-artifact@v7
        with:
          name: next-build
          path: .next

      - name: Prepare isolated E2E database
        run: npm run e2e:db:prepare

      - name: Rehearse terminal schema contract
        run: npm run e2e:db:rehearse-contract

      - name: Verify configured E2E database contract
        run: npm run check:database-schema

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright shard
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4 --workers=1 --retries=0

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Upload failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  # Temporary release aid: remove after reviewing/committing the Linux PNGs.
  # This job never updates Git and does not replace any ordinary E2E gate.
  visual-baselines:
    name: Generate and verify Linux visual baselines
    if: >-
      github.event_name == 'pull_request'
      && github.head_ref == 'fix-admin-customer-details'
      && github.event.pull_request.head.repo.full_name == github.repository
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atehna_e2e_run_${{ github.run_id }}_${{ github.run_attempt }}_visual_baselines
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atehna_e2e_run_${{ github.run_id }}_${{ github.run_attempt }}_visual_baselines"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: '1'
      E2E_MODE: '1'
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atehna_e2e_run_${{ github.run_id }}_${{ github.run_attempt }}_visual_baselines
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atehna_e2e_run_${{ github.run_id }}_${{ github.run_attempt }}_visual_baselines
      E2E_STORAGE_NAMESPACE: run-${{ github.run_id }}-${{ github.run_attempt }}-visual-baselines
      ADMIN_USERNAME: e2e-admin
      ADMIN_PASSWORD: e2e-admin-password
      ADMIN_SESSION_SECRET: e2e-only-session-secret-with-at-least-32-characters
      ORDER_ACCESS_BOOTSTRAP_KEY: e2e-only-order-bootstrap-key-with-at-least-32-characters
      PLAYWRIGHT_SHARD: visual-baselines
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Checkout the same candidate as the production build
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download production build
        uses: actions/download-artifact@v7
        with:
          name: next-build
          path: .next

      - name: Prepare isolated visual E2E database
        run: npm run e2e:db:prepare

      - name: Rehearse terminal schema contract
        run: npm run e2e:db:rehearse-contract

      - name: Verify configured E2E database contract
        run: npm run check:database-schema

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate candidate Linux order and quote screenshots
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: visual-baselines-generation-report
          PLAYWRIGHT_JSON_OUTPUT_FILE: visual-baselines-generation.json
        run: >-
          npm run test:e2e --
          tests/e2e/admin-order-quote-visual-regression.spec.ts
          --project=chromium --workers=1 --retries=0
          --update-snapshots --reporter=list,html,json
          --output=visual-baselines-generation-results

      - name: Reset only the owned disposable database for independent validation
        run: npm run e2e:db:prepare

      - name: Verify generated screenshots without updating them
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: visual-baselines-validation-report
          PLAYWRIGHT_JSON_OUTPUT_FILE: visual-baselines-validation.json
        run: >-
          npm run test:e2e --
          tests/e2e/admin-order-quote-visual-regression.spec.ts
          --project=chromium --workers=1 --retries=0
          --update-snapshots=none --reporter=list,html,json
          --output=visual-baselines-validation-results

      - name: Verify every visual case passed exactly once
        run: |
          PLAYWRIGHT_JSON_OUTPUT_FILE=visual-baselines-expected.json npx playwright test tests/e2e/admin-order-quote-visual-regression.spec.ts --list --project=chromium --reporter=json
          npm run e2e:report:verify -- visual-baselines-generation.json visual-baselines-expected.json
          npm run e2e:report:verify -- visual-baselines-validation.json visual-baselines-expected.json

      - name: Upload verified candidate PNGs for review, not automatic acceptance
        uses: actions/upload-artifact@v7
        with:
          name: linux-visual-baselines-${{ github.event.pull_request.head.sha }}
          path: tests/e2e/admin-order-quote-visual-regression.spec.ts-snapshots/*-chromium-linux.png
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Upload baseline generation and validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-visual-baseline-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            visual-baselines-generation.json
            visual-baselines-validation.json
            visual-baselines-expected.json
            visual-baselines-generation-report
            visual-baselines-validation-report
            visual-baselines-generation-results
            visual-baselines-validation-results
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  e2e-report:
    name: Merge and verify E2E report
    if: ${{ !cancelled() }}
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download all shard reports
        uses: actions/download-artifact@v7
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge blob reports to HTML
        run: npx playwright merge-reports --reporter=html all-blob-reports

      - name: Create merged and expected JSON inventories
        run: |
          PLAYWRIGHT_JSON_OUTPUT_FILE=merged-results.json npx playwright merge-reports --reporter=json all-blob-reports
          PLAYWRIGHT_JSON_OUTPUT_FILE=expected-tests.json npx playwright test --list --reporter=json

      - name: Verify one passing execution per retained test
        run: npm run e2e:report:verify -- merged-results.json expected-tests.json

      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-html-report
          path: playwright-report
          if-no-files-found: error
          retention-days: 14
          overwrite: true
