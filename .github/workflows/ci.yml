name: CI

on:
  pull_request:
  workflow_dispatch:

# Only disposable PR verification is superseded. Explicit full runs keep their
# own group, so they cannot cancel each other or a PR candidate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify schema contract files
        run: npm run check:schema-contract

      - name: Lint
        run: npm run lint

      - name: Install PDF rasterization tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils

      - name: Unit and contract tests
        run: npm run test:unit

      - name: Restore Next.js compiler cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node24-next-${{ hashFiles('package.json', 'package-lock.json', 'next.config.mjs', 'tsconfig.json', 'postcss.config.mjs', 'tailwind.config.ts', '.github/workflows/ci.yml') }}-${{ hashFiles('src/**', 'public/**', 'database/**', 'tests/**', 'scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node24-next-${{ hashFiles('package.json', 'package-lock.json', 'next.config.mjs', 'tsconfig.json', 'postcss.config.mjs', 'tailwind.config.ts', '.github/workflows/ci.yml') }}-

      # Next 16.3 uses the project-local tsc CLI with this complete tsconfig.
      # Keep npm run typecheck for fast local feedback, without running it twice here.
      - name: Build and full-project TypeScript check
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: |
            .next
            !.next/cache/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  e2e:
    name: E2E shard ${{ matrix.shard }}/4
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atehna_e2e_run_${{ github.run_id }}_${{ github.run_attempt }}_shard_${{ matrix.shard }}
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atehna_e2e_run_${{ github.run_id }}_${{ github.run_attempt }}_shard_${{ matrix.shard }}"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: '1'
      E2E_MODE: '1'
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atehna_e2e_run_${{ github.run_id }}_${{ github.run_attempt }}_shard_${{ matrix.shard }}
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atehna_e2e_run_${{ github.run_id }}_${{ github.run_attempt }}_shard_${{ matrix.shard }}
      E2E_STORAGE_NAMESPACE: run-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
      E2E_ADMIN_USERNAME: e2e-admin
      E2E_ADMIN_PASSWORD: e2e-admin-password
      ADMIN_SESSION_SECRET: e2e-only-session-secret-with-at-least-32-characters
      ORDER_ACCESS_BOOTSTRAP_KEY: e2e-only-order-bootstrap-key-with-at-least-32-characters
      PLAYWRIGHT_SHARD: ${{ matrix.shard }}-of-4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download production build
        uses: actions/download-artifact@v7
        with:
          name: next-build
          path: .next

      - name: Prepare isolated E2E database
        run: npm run e2e:db:prepare

      - name: Verify configured E2E database contract
        run: npm run check:database-schema

      - name: Verify storage lifecycle PostgreSQL boundaries
        if: matrix.shard == 1
        env:
          STORAGE_LIFECYCLE_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run test:storage-db

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright shard
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4 --workers=1 --retries=0

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Upload failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  e2e-report:
    name: Merge and verify E2E report
    # A condition-skipped required job is accepted by GitHub. Always evaluate
    # this bounded gate, including when an upstream job or the run is cancelled.
    if: ${{ always() }}
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reject cancellation before report setup
        if: cancelled()
        run: |
          echo "::error::Verification was cancelled before report setup."
          exit 1

      - name: Require successful verification jobs
        if: always()
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          if [ "$CHECKS_RESULT" != "success" ] || [ "$E2E_RESULT" != "success" ]; then
            echo "::error::Required jobs did not succeed (checks: $CHECKS_RESULT, e2e: $E2E_RESULT)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download all shard reports
        uses: actions/download-artifact@v7
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge blob reports to HTML and JSON
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=merged-results.json npx playwright merge-reports --reporter=html,json all-blob-reports

      - name: Collect expected test inventory
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=expected-tests.json npx playwright test --list --reporter=json

      - name: Verify one passing execution per retained test
        id: verify-report
        run: npm run e2e:report:verify -- merged-results.json expected-tests.json

      - name: Require a complete verified report
        if: always()
        env:
          REPORT_RESULT: ${{ steps.verify-report.outcome }}
        run: |
          if [ "$REPORT_RESULT" != "success" ]; then
            echo "::error::Complete report verification did not succeed (report: $REPORT_RESULT)."
            exit 1
          fi

      - name: Upload merged HTML report
        if: ${{ always() && (steps.verify-report.outcome == 'success' || steps.verify-report.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-html-report
          path: playwright-report
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Reject cancelled verification
        if: cancelled()
        run: |
          echo "::error::Verification was cancelled; it cannot satisfy the required gate."
          exit 1
