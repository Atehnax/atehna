<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800" role="img"><title>Aluminijasta plošča — 0,5 × 200 × 100 mm</title><desc>Aluminijasta plošča; 0,5 × 200 × 100 mm; Dolžina 200 mm; Širina 100 mm; Debelina 0,5 mm</desc><defs><marker id="dimension-arrow" markerWidth="20" markerHeight="20" refX="10" refY="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 20 10 L 0 20 Z" fill="#8393a1"/></marker></defs><rect width="1800" height="1800" fill="#ffffff"/><g fill="#19354d" font-family="Arial, Helvetica, sans-serif"><text x="900" y="128" font-size="78" text-anchor="middle" fill="#19354d" font-weight="700">Aluminijasta plošča</text><text x="900" y="290" font-size="48" text-anchor="middle" fill="#657381" font-weight="400">0,5 × 200 × 100 mm</text><text x="900" y="405" font-size="32" text-anchor="middle" fill="#657381" letter-spacing="3" font-weight="600">TEHNIČNA SKICA · MERE V MM</text><text x="735" y="470" font-size="32" text-anchor="middle" fill="#657381" letter-spacing="3" font-weight="600">POGLED OD ZGORAJ</text><rect x="220" y="592.5" width="1030" height="515" fill="#f1f5f8" stroke="#19354d" stroke-width="5"/><path d="M 220 1117.5 L 220 1195.5" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 1250 1117.5 L 1250 1195.5" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 220 1177.5 L 1250 1177.5" fill="none" stroke="#8393a1" stroke-width="3" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/><text x="735" y="1255.5" font-size="64" text-anchor="middle" font-weight="600">L = 200 mm</text><path d="M 1260 592.5 L 1338 592.5" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 1260 1107.5 L 1338 1107.5" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 1320 592.5 L 1320 1107.5" fill="none" stroke="#8393a1" stroke-width="3" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/><text x="1358" y="870.3" font-size="58" font-weight="600">W = 100 mm</text><text x="735" y="1415" font-size="32" text-anchor="middle" fill="#657381" letter-spacing="3" font-weight="600">POGLED S STRANI</text><rect x="220" y="1485" width="1030" height="20" fill="#f1f5f8" stroke="#19354d" stroke-width="5"/><path d="M 1260 1485 L 1338 1485" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 1260 1505 L 1338 1505" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 1320 1427 L 1320 1485" fill="none" stroke="#8393a1" stroke-width="3" marker-end="url(#dimension-arrow)"/><path d="M 1320 1563 L 1320 1505" fill="none" stroke="#8393a1" stroke-width="3" marker-end="url(#dimension-arrow)"/><text x="1358" y="1515.3" font-size="58" font-weight="600">t = 0,5 mm</text><text x="900" y="1630" font-size="38" text-anchor="middle" fill="#657381">Debelina je zaradi berljivosti povečana.</text><text x="900" y="1740" font-size="38" text-anchor="middle" fill="#657381">Skica ni v merilu.</text></g></svg>