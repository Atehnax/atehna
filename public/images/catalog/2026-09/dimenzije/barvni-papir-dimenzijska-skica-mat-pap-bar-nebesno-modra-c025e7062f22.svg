<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800" role="img"><title>Barvni papir — nebesno modra</title><desc>Barvni papir; nebesno modra; Dolžina 500 mm; Širina 707 mm</desc><defs><marker id="dimension-arrow" markerWidth="20" markerHeight="20" refX="10" refY="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 20 10 L 0 20 Z" fill="#8393a1"/></marker></defs><rect width="1800" height="1800" fill="#ffffff"/><g fill="#19354d" font-family="Arial, Helvetica, sans-serif"><text x="900" y="128" font-size="78" text-anchor="middle" fill="#19354d" font-weight="700">Barvni papir</text><text x="900" y="290" font-size="48" text-anchor="middle" fill="#657381" font-weight="400">nebesno modra</text><text x="900" y="405" font-size="32" text-anchor="middle" fill="#657381" letter-spacing="3" font-weight="600">TEHNIČNA SKICA · MERE V MM</text><text x="735" y="470" font-size="32" text-anchor="middle" fill="#657381" letter-spacing="3" font-weight="600">POGLED OD ZGORAJ</text><rect x="512.2277227722773" y="535" width="445.54455445544556" height="630" fill="#d7e5f1" stroke="#19354d" stroke-width="5"/><path d="M 512.2277227722773 1175 L 512.2277227722773 1253" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 957.7722772277228 1175 L 957.7722772277228 1253" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 512.2277227722773 1235 L 957.7722772277228 1235" fill="none" stroke="#8393a1" stroke-width="3" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/><text x="735" y="1313" font-size="64" text-anchor="middle" font-weight="600">L = 500 mm</text><path d="M 967.7722772277228 535 L 1045.772277227723 535" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 967.7722772277228 1165 L 1045.772277227723 1165" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 1027.772277227723 535 L 1027.772277227723 1165" fill="none" stroke="#8393a1" stroke-width="3" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/><text x="1065.772277227723" y="870.3" font-size="58" font-weight="600">W = 707 mm</text><text x="900" y="1450" font-size="32" text-anchor="middle" fill="#657381" letter-spacing="3" font-weight="600">DEBELINA</text><text x="900" y="1535" font-size="38" text-anchor="middle" fill="#657381">Debelina ni navedena.</text><text x="900" y="1740" font-size="38" text-anchor="middle" fill="#657381">Skica ni v merilu. Barva je shematska.</text></g></svg>