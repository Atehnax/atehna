<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800" role="img"><title>Geotrikotnik za tablo — 60 cm, magneten</title><desc>Geotrikotnik za tablo; 60 cm, magneten; Dolžina 600 mm</desc><defs><marker id="dimension-arrow" markerWidth="20" markerHeight="20" refX="10" refY="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 20 10 L 0 20 Z" fill="#8393a1"/></marker></defs><rect width="1800" height="1800" fill="#ffffff"/><g fill="#19354d" font-family="Arial, Helvetica, sans-serif"><text x="900" y="128" font-size="78" text-anchor="middle" fill="#19354d" font-weight="700">Geotrikotnik za tablo</text><text x="900" y="290" font-size="48" text-anchor="middle" fill="#657381" font-weight="400">60 cm, magneten</text><text x="900" y="405" font-size="32" text-anchor="middle" fill="#657381" letter-spacing="3" font-weight="600">TEHNIČNA SKICA · MERE V MM</text><text x="735" y="470" font-size="32" text-anchor="middle" fill="#657381" letter-spacing="3" font-weight="600">POGLED OD ZGORAJ</text><path d="M 220 1150 L 1250 1150 L 735 635 Z" fill="#f1f5f8" stroke="#19354d" stroke-width="5" stroke-linejoin="round"/><text x="348" y="1108" font-size="52" text-anchor="middle" fill="#19354d">45°</text><path d="M 220 1160 L 220 1248" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 1250 1160 L 1250 1248" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 220 1230 L 1250 1230" fill="none" stroke="#8393a1" stroke-width="3" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/><text x="735" y="1308" font-size="64" text-anchor="middle" font-weight="600">Hipotenuza = 600 mm</text><text x="900" y="1510" font-size="38" text-anchor="middle" fill="#657381">Druge stranice in debelina niso navedene.</text><text x="900" y="1740" font-size="38" text-anchor="middle" fill="#657381">Skica ni v merilu.</text></g></svg>