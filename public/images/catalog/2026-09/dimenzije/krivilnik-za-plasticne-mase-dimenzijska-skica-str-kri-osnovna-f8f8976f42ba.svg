<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800" role="img" aria-labelledby="machine-title machine-description"><title id="machine-title">Krivilnik za plastične mase THERMOFORM 400 – tehnična skica</title><desc id="machine-description">Tehnična skica · mere v milimetrih. Prikazana je delovna površina; zunanje mere celotnega stroja niso navedene. Skica ni v merilu. Vira: Alton THERMOFORM 400 in Atehna.</desc><metadata>{&quot;basis&quot;:[&quot;https://alton.nl/thermoform-400.html&quot;,&quot;https://atehna.si/product/krivilnik-za-plasticne-mase-thermoform-400/&quot;,&quot;Alton: delovna širina 400 mm; največja debelina materiala 5 mm.&quot;,&quot;Atehna: delovna površina 440 × 165 mm; dolžina grelne žice 400 mm.&quot;,&quot;Zunanje mere celotnega stroja niso potrjene; diagram prikazuje samo delovno površino.&quot;],&quot;schematic&quot;:true}</metadata><defs><marker id="machine-dimension-arrow" markerWidth="15" markerHeight="15" refX="10" refY="5" viewBox="0 0 10 10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs><rect width="1800" height="1800" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif" fill="#334155" stroke-linecap="round" stroke-linejoin="round"><text x="100" y="134" font-size="62" font-weight="600" letter-spacing="-0.5">Krivilnik za plastične mase THERMOFORM 400</text><text x="100" y="202" font-size="38" fill="#64748b">Tehnična skica · mere v milimetrih</text><text x="200" y="342" font-size="46" font-weight="600">Delovna površina · pogled od zgoraj</text><rect x="200" y="530" width="1100" height="412.5" fill="#f8fafc" stroke="#334155" stroke-width="3"/><g class="dimension"><line x1="200" y1="530" x2="200" y2="428" stroke="#94a3b8" stroke-width="2.4"/><line x1="1300" y1="530" x2="1300" y2="428" stroke="#94a3b8" stroke-width="2.4"/><line x1="200" y1="442" x2="1300" y2="442" stroke="#334155" stroke-width="2.4" marker-start="url(#machine-dimension-arrow)" marker-end="url(#machine-dimension-arrow)"/><text x="750" y="417" font-size="52" text-anchor="middle" font-weight="500">440 mm</text></g><g class="dimension"><line x1="1300" y1="530" x2="1399" y2="530" stroke="#94a3b8" stroke-width="2.4"/><line x1="1300" y1="942.5" x2="1399" y2="942.5" stroke="#94a3b8" stroke-width="2.4"/><line x1="1385" y1="530" x2="1385" y2="942.5" stroke="#334155" stroke-width="2.4" marker-start="url(#machine-dimension-arrow)" marker-end="url(#machine-dimension-arrow)"/><text x="1413" y="754.25" font-size="52" text-anchor="start" font-weight="500">165 mm</text></g><text x="250" y="630" font-size="44" >Grelna žica</text><line x1="250" y1="695" x2="1250" y2="695" stroke="#334155" stroke-width="5"/><g class="dimension"><line x1="250" y1="695" x2="250" y2="814" stroke="#94a3b8" stroke-width="2.4"/><line x1="1250" y1="695" x2="1250" y2="814" stroke="#94a3b8" stroke-width="2.4"/><line x1="250" y1="800" x2="1250" y2="800" stroke="#334155" stroke-width="2.4" marker-start="url(#machine-dimension-arrow)" marker-end="url(#machine-dimension-arrow)"/><text x="750" y="862" font-size="52" text-anchor="middle" font-weight="500">400 mm</text></g><text x="200" y="1210" font-size="46" font-weight="600">Največja debelina materiala</text><text x="200" y="1304" font-size="76" >5 mm</text><text x="100" y="1703" font-size="30" fill="#64748b">Prikazana je delovna površina; zunanje mere celotnega stroja niso navedene.</text><text x="100" y="1750" font-size="30" fill="#64748b">Skica ni v merilu. Vira: Alton THERMOFORM 400 in Atehna.</text></g></svg>