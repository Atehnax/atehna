<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800" role="img"><title>Vezana plošča — Topol / 3 x 250 x 500</title><desc>Vezana plošča; Topol / 3 x 250 x 500; Dolžina 250 mm; Širina 500 mm; Debelina 3 mm</desc><defs><marker id="dimension-arrow" markerWidth="20" markerHeight="20" refX="10" refY="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 20 10 L 0 20 Z" fill="#8393a1"/></marker></defs><rect width="1800" height="1800" fill="#ffffff"/><g fill="#19354d" font-family="Arial, Helvetica, sans-serif"><text x="900" y="128" font-size="78" text-anchor="middle" fill="#19354d" font-weight="700">Vezana plošča</text><text x="900" y="290" font-size="48" text-anchor="middle" fill="#657381" font-weight="400">Topol / 3 x 250 x 500</text><text x="900" y="405" font-size="32" text-anchor="middle" fill="#657381" letter-spacing="3" font-weight="600">TEHNIČNA SKICA · MERE V MM</text><text x="735" y="470" font-size="32" text-anchor="middle" fill="#657381" letter-spacing="3" font-weight="600">POGLED OD ZGORAJ</text><rect x="577.5" y="535" width="315" height="630" fill="#f1f5f8" stroke="#19354d" stroke-width="5"/><path d="M 577.5 1175 L 577.5 1253" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 892.5 1175 L 892.5 1253" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 577.5 1235 L 892.5 1235" fill="none" stroke="#8393a1" stroke-width="3" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/><text x="735" y="1313" font-size="64" text-anchor="middle" font-weight="600">L = 250 mm</text><path d="M 902.5 535 L 980.5 535" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 902.5 1165 L 980.5 1165" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 962.5 535 L 962.5 1165" fill="none" stroke="#8393a1" stroke-width="3" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/><text x="1000.5" y="870.3" font-size="58" font-weight="600">W = 500 mm</text><text x="735" y="1415" font-size="32" text-anchor="middle" fill="#657381" letter-spacing="3" font-weight="600">POGLED S STRANI</text><rect x="577.5" y="1485" width="315" height="20" fill="#f1f5f8" stroke="#19354d" stroke-width="5"/><path d="M 902.5 1485 L 980.5 1485" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 902.5 1505 L 980.5 1505" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 962.5 1427 L 962.5 1485" fill="none" stroke="#8393a1" stroke-width="3" marker-end="url(#dimension-arrow)"/><path d="M 962.5 1563 L 962.5 1505" fill="none" stroke="#8393a1" stroke-width="3" marker-end="url(#dimension-arrow)"/><text x="1000.5" y="1515.3" font-size="58" font-weight="600">t = 3 mm</text><text x="900" y="1630" font-size="38" text-anchor="middle" fill="#657381">Debelina je zaradi berljivosti povečana.</text><text x="900" y="1740" font-size="38" text-anchor="middle" fill="#657381">Skica ni v merilu.</text></g></svg>