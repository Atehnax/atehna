<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800" role="img"><title>Vezana plošča — Lesna vrsta ni navedena / 4 x 50 x 60</title><desc>Vezana plošča; Lesna vrsta ni navedena / 4 x 50 x 60; Dolžina 50 mm; Širina 60 mm; Debelina 4 mm</desc><defs><marker id="dimension-arrow" markerWidth="20" markerHeight="20" refX="10" refY="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 20 10 L 0 20 Z" fill="#8393a1"/></marker></defs><rect width="1800" height="1800" fill="#ffffff"/><g fill="#19354d" font-family="Arial, Helvetica, sans-serif"><text x="900" y="128" font-size="78" text-anchor="middle" fill="#19354d" font-weight="700">Vezana plošča</text><text x="900" y="290" font-size="48" text-anchor="middle" fill="#657381" font-weight="400">Lesna vrsta ni navedena / 4 x 50 x 60</text><text x="900" y="405" font-size="32" text-anchor="middle" fill="#657381" letter-spacing="3" font-weight="600">TEHNIČNA SKICA · MERE V MM</text><text x="735" y="470" font-size="32" text-anchor="middle" fill="#657381" letter-spacing="3" font-weight="600">POGLED OD ZGORAJ</text><rect x="472.5" y="535" width="525" height="630" fill="#f1f5f8" stroke="#19354d" stroke-width="5"/><path d="M 472.5 1175 L 472.5 1253" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 997.5 1175 L 997.5 1253" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 472.5 1235 L 997.5 1235" fill="none" stroke="#8393a1" stroke-width="3" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/><text x="735" y="1313" font-size="64" text-anchor="middle" font-weight="600">L = 50 mm</text><path d="M 1007.5 535 L 1085.5 535" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 1007.5 1165 L 1085.5 1165" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 1067.5 535 L 1067.5 1165" fill="none" stroke="#8393a1" stroke-width="3" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/><text x="1105.5" y="870.3" font-size="58" font-weight="600">W = 60 mm</text><text x="735" y="1415" font-size="32" text-anchor="middle" fill="#657381" letter-spacing="3" font-weight="600">POGLED S STRANI</text><rect x="472.5" y="1474" width="525" height="42" fill="#f1f5f8" stroke="#19354d" stroke-width="5"/><path d="M 1007.5 1474 L 1085.5 1474" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 1007.5 1516 L 1085.5 1516" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 1067.5 1416 L 1067.5 1474" fill="none" stroke="#8393a1" stroke-width="3" marker-end="url(#dimension-arrow)"/><path d="M 1067.5 1574 L 1067.5 1516" fill="none" stroke="#8393a1" stroke-width="3" marker-end="url(#dimension-arrow)"/><text x="1105.5" y="1515.3" font-size="58" font-weight="600">t = 4 mm</text><text x="900" y="1740" font-size="38" text-anchor="middle" fill="#657381">Skica ni v merilu.</text></g></svg>