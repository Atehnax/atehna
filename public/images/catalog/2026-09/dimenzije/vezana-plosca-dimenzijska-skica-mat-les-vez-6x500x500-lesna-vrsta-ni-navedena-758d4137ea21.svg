t="600">W = 500 mm</text><text x="735" y="1415" font-size="32" text-anchor="middle" fill="#657381" letter-spacing="3" font-weight="600">POGLED S STRANI</text><rect x="420" y="1485" width="630" height="20" fill="#f1f5f8" stroke="#19354d" stroke-width="5"/><path d="M 1060 1485 L 1138 1485" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 1060 1505 L 1138 1505" fill="none" stroke="#8393a1" stroke-width="3" /><path d="M 1120 1427 L 1120 1485" fill="none" stroke="#8393a1" stroke-width="3" marker-end="url(#dimension-arrow)"/><path d="M 1120 1563 L 1120 1505" fill="none" stroke="#8393a1" stroke-width="3" marker-end="url(#dimension-arrow)"/><text x="1158" y="1515.3" font-size="58" font-weight="600">t = 6 mm</text><text x="900" y="1630" font-size="38" text-anchor="middle" fill="#657381">Debelina je zaradi berljivosti povečana.</text><text x="900" y="1740" font-size="38" text-anchor="middle" fill="#657381">Skica ni v merilu.</text></g></svg>